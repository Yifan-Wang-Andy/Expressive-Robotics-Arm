[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaacsim-trajectories"
version = "0.1.0"
description = "Offline dummy trajectory generation and file-based Isaac Sim SO-101 replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]
